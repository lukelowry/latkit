version: 2

build:
  os: ubuntu-24.04
  tools:
    python: '3.13'
    nodejs: '24'
  jobs:
    post_install:
      - corepack enable
      - corepack prepare pnpm@10.30.0 --activate
      - corepack pnpm install --frozen-lockfile
    pre_build:
      - corepack pnpm docs:api

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
