name: Release

# Once CI passes on main, releases the commit it tested.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: read
  contents: write
  id-token: write
  pull-requests: write

env:
  CI: true
  NPM_CONFIG_ACCESS: public
  NPM_CONFIG_PROVENANCE: true

jobs:
  release:
    name: Version or publish
    # A push's run only: a pull request's run can come from a fork's branch named main.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Verify manual recovery uses a commit that passed CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow ci.yml --branch main --commit "$(git rev-parse HEAD)" --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - name: Read the WASM bindings generator's version
        id: bindgen
        run: |
          echo "version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: bindgen-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.bindgen.outputs.version }}
      - name: Install the matching WASM bindings generator
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.bindgen.outputs.version }}" --locked
      - run: pnpm --dir npm/examples exec playwright-core install --with-deps chromium
      # The tarball a consumer installs, checked in Chrome; `pnpm release` publishes this file.
      - run: cargo xtask package
      - run: cargo xtask package-test
      # One retryable release verifies npm and both crates before creating tags.
      - name: Open a version pull request, or publish all distributions
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
