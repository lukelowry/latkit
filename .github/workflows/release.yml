name: Release

# Releases each commit on main. Branch protection admits only commits whose pull request passed CI
# on a branch up to date with main, so every commit here is a tree that passed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  CI: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NPM_CONFIG_ACCESS: public
  NPM_CONFIG_PROVENANCE: true

jobs:
  # What the commit releases: pending changesets open or update the version PR, a version not yet
  # tagged publishes, and a tagged one has nothing left to do.
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      step: ${{ steps.plan.outputs.step }}
    steps:
      - uses: actions/checkout@v6
      - name: Decide what the commit releases
        id: plan
        run: |
          version=$(jq -r .version npm/package.json)
          if compgen -G '.changeset/*.md' > /dev/null; then
            echo "step=version" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/latkit@$version" > /dev/null; then
            echo "step=none" >> "$GITHUB_OUTPUT"
          else
            echo "step=publish" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Version or publish
    needs: plan
    if: needs.plan.outputs.step != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      PUBLISH: ${{ needs.plan.outputs.step == 'publish' }}
      # The runner's Chrome draws the consumer test.
      LATKIT_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Read the WASM bindings generator's version
        if: env.PUBLISH == 'true'
        id: bindgen
        run: |
          version=$(cargo xtask bindgen-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: env.PUBLISH == 'true'
        id: bindgen-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.bindgen.outputs.version }}
      - name: Install the matching WASM bindings generator
        if: env.PUBLISH == 'true' && steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.bindgen.outputs.version }}" --locked
      # The tarball a consumer installs, checked in Chrome; `pnpm release` publishes this file.
      - if: env.PUBLISH == 'true'
        run: cargo xtask package
      - if: env.PUBLISH == 'true'
        run: cargo xtask package-test
      # One retryable release verifies npm and both crates before creating tags.
      - name: Open a version pull request, or publish all distributions
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
