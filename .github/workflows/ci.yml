name: CI

# What a release depends on: the crates build, pass their tests, document, and package on every
# platform they ship to; the npm tarball works in a consumer; the docs build. Frame budgets and the
# benchmark need a GPU, which runners lack: run `cargo xtask check` and `cargo xtask bench` locally.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main runs to the end, since
# the release waits on it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # What a pull request touched; a push to main checks everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      npm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.npm == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust: &rust
              - 'crates/**'
              - 'xtask/**'
              - '.cargo/**'
              - '*.toml'
              - 'Cargo.lock'
              - 'docs/reference/**'
              - '.github/workflows/ci.yml'
            npm:
              - *rust
              - 'npm/**'
              - 'benchmark/**'
              - 'package.json'
              - 'pnpm-*.yaml'
              - '*.config.*'
              - 'tsconfig*.json'
            docs:
              - 'docs/**'
              - '.readthedocs.yaml'
              - 'npm/test/consumer/quickstart.ts'
              - '.github/workflows/ci.yml'

  # Prettier over every file: cheap, and any pull request can unformat one.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p latkit --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --locked -p latkit-js --target wasm32-unknown-unknown -- -D warnings
      # Lavapipe, Vulkan on the CPU, runs the GPU tests instead of skipping; text tests need fonts.
      - name: Install a software Vulkan driver and fonts for the GPU tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers fonts-dejavu-core
      - run: cargo test --locked --workspace
        env:
          LATKIT_REQUIRE_GPU: 1
      - run: cargo test --locked -p latkit --no-default-features
        env:
          LATKIT_REQUIRE_GPU: 1
      - name: Document the library
        run: cargo doc --locked -p latkit --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify the native package
        run: cargo package --locked -p latkit
      - name: Verify the browser-target package
        run: cargo package --locked -p latkit --target wasm32-unknown-unknown --features web
      - name: Keep native font code out of browser builds
        run: cargo check --locked -p latkit --target wasm32-unknown-unknown --features native,web

  # The CLI's native code on the other platforms it installs on; Linux runs in `rust`.
  native-cli:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --package latkit --features native --lib --test validation
      - run: cargo test --locked --package latkit-cli

  # The npm package: built from the crate, checked, tested, every pipeline compiled in Chrome on
  # SwiftShader, and the packed tarball installed and drawn in a consumer.
  npm:
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - name: Read the WASM bindings generator's version
        id: bindgen
        run: |
          echo "version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: bindgen-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.bindgen.outputs.version }}
      - name: Install the matching WASM bindings generator
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.bindgen.outputs.version }}" --locked
      - run: pnpm --dir npm/examples exec playwright-core install --with-deps chromium
      - run: cargo xtask wasm --dev
      - run: pnpm lint
      - run: node npm/docs.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo xtask browser
      - run: cargo xtask package
      - run: cargo xtask package-test

  # The docs as Read the Docs builds them: a warning fails.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: sphinx-build -W --keep-going -b html docs target/docs

  # The one check branch protection requires: every job above passed, or was not needed.
  passed:
    name: CI passed
    if: always()
    needs: [changes, format, rust, native-cli, npm, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
