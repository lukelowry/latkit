name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  npm-wasm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - name: Read the WASM bindings generator's version
        id: bindgen
        run: |
          echo "version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: bindgen-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.bindgen.outputs.version }}
      - name: Install matching WASM bindings generator
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.bindgen.outputs.version }}" --locked
      - run: pnpm --dir npm/examples exec playwright-core install --with-deps chromium
      - run: cargo xtask package
      - run: cargo xtask package-test

  rust-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pinned Rust toolchain
        run: rustup show
      - name: Test Rust library
        run: cargo test --locked --package latkit --lib
      - name: Verify native Rust package
        run: cargo package --locked --package latkit
      - name: Verify browser-target Rust package
        run: >-
          cargo package --locked --package latkit
          --target wasm32-unknown-unknown
          --features web,serde

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm build:examples
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm -r --filter "./packages/**" exec npm pack --dry-run

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench:gate

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r docs/requirements.txt
      - run: pnpm docs:build
