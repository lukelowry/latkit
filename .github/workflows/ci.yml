name: CI

# What a release depends on: the crates build, pass their tests, document, and package on every
# platform they ship to; the npm tarball works in a consumer; the docs build. The jobs that build
# Rust run their steps as `cargo xtask ci <job>`, and `cargo xtask check` runs every job's steps.
# Frame budgets and the benchmark need a GPU, which runners lack: run `cargo xtask check` and
# `cargo xtask bench` locally.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main runs to the end, since
# the release waits on it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # What a pull request touched; a push to main checks everything, once per tree. A push whose tree a
  # pull request's run passed checks nothing again, nor does the version pull request or its merge,
  # which change only versions and the changelog (the release packages and tests the commit it
  # publishes). macOS, whose runners queue for minutes, runs on pull requests that touch native
  # code, and before every publish.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tree: ${{ steps.tested.outputs.tree }}
      rust: ${{ steps.tested.outputs.fresh == 'true' && github.head_ref != 'changeset-release/main' && (github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true') }}
      native: ${{ steps.tested.outputs.fresh == 'true' && github.head_ref != 'changeset-release/main' && github.event_name == 'pull_request' && steps.filter.outputs.native == 'true' }}
      npm: ${{ steps.tested.outputs.fresh == 'true' && github.head_ref != 'changeset-release/main' && (github.event_name != 'pull_request' || steps.filter.outputs.npm == 'true') }}
      docs: ${{ steps.tested.outputs.fresh == 'true' && github.head_ref != 'changeset-release/main' && (github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true') }}
    steps:
      - uses: actions/checkout@v6
      - name: Find whether this tree already passed
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          fresh=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Only this repository's runs count, so a fork's pull request cannot vouch for a tree.
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=passed-$tree" \
              --jq '[.artifacts[] | select(.workflow_run.head_repository_id == ${{ github.repository_id }})] | length')
            merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.ref // ""')
            if [ "$passed" -gt 0 ] || [ "$merged" = changeset-release/main ]; then fresh=false; fi
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust: &rust
              - 'crates/**'
              - 'xtask/**'
              - '.cargo/**'
              - '*.toml'
              - 'Cargo.lock'
              - 'docs/reference/**'
              - '.github/workflows/ci.yml'
            npm:
              - *rust
              - 'npm/**'
              - 'benchmark/**'
              - 'package.json'
              - 'pnpm-*.yaml'
              - '*.config.*'
              - 'tsconfig*.json'
            docs:
              - 'docs/**'
              - '.readthedocs.yaml'
              - 'npm/test/consumer/quickstart.ts'
              - '.github/workflows/ci.yml'
            native:
              - 'crates/latkit/src/host/**'
              - 'crates/latkit-cli/**'
              - 'crates/latkit/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'

  # Prettier over every file: cheap, and any pull request can unformat one.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Lavapipe, Vulkan on the CPU, runs the GPU tests instead of skipping; text tests need fonts.
      # Cached, since apt took up to 7 minutes.
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: mesa-vulkan-drivers fonts-dejavu-core
          version: 1
      - run: cargo xtask ci rust

  # The CLI's native code on the other platforms it installs on; Linux runs in `rust`. Windows runs
  # with `rust`, and macOS only when native code changed: the release checks it before publishing.
  native-cli:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.native == 'true' && '["macos-latest", "windows-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask ci native-cli

  # The npm package: built once from the crate in release, checked, tested, every pipeline compiled
  # in Chrome on SwiftShader, and that build packed, installed, and drawn in a consumer.
  npm:
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - name: Read the WASM bindings generator's version
        id: bindgen
        run: |
          version=$(cargo xtask bindgen-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: bindgen-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.bindgen.outputs.version }}
      - name: Install the matching WASM bindings generator
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.bindgen.outputs.version }}" --locked
      # The runner's Chrome drives the browser gate.
      - run: cargo xtask ci npm
        env:
          LATKIT_CHROME: /usr/bin/google-chrome

  # The docs as Read the Docs builds them, from the locked environment: a warning fails.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked --project docs --group docs
      - run: uv run --locked --project docs sphinx-build -W --keep-going -b html docs target/docs

  # The one check branch protection requires: every job above passed, or was not needed. A pull
  # request's pass records its tree, so main's run after the merge checks nothing again.
  passed:
    name: CI passed
    if: always()
    needs: [changes, format, rust, native-cli, npm, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.changes.result != 'success'
        run: exit 1
      - if: github.event_name == 'pull_request'
        run: echo "${{ github.sha }}" > passed.txt
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: passed-${{ needs.changes.outputs.tree }}
          path: passed.txt
          retention-days: 14
