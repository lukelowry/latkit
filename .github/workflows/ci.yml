name: CI

# What a release depends on: the crates build, pass their tests, document, and package on every
# platform they ship to; the npm tarball works in a consumer; the docs build. Frame budgets and the
# benchmark need a GPU, which runners lack: run `cargo xtask check` and `cargo xtask bench` locally.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p latkit --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --locked -p latkit-js --target wasm32-unknown-unknown -- -D warnings
      # Lavapipe, Vulkan on the CPU, runs the GPU tests instead of skipping; text tests need fonts.
      - name: Install a software Vulkan driver and fonts for the GPU tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers fonts-dejavu-core
      - run: cargo test --locked --workspace
        env:
          LATKIT_REQUIRE_GPU: 1
      - run: cargo test --locked -p latkit --no-default-features
        env:
          LATKIT_REQUIRE_GPU: 1
      - name: Document the library
        run: cargo doc --locked -p latkit --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify the native package
        run: cargo package --locked -p latkit
      - name: Verify the browser-target package
        run: cargo package --locked -p latkit --target wasm32-unknown-unknown --features web
      - name: Keep native font code out of browser builds
        run: cargo check --locked -p latkit --target wasm32-unknown-unknown --features native,web

  # The CLI's native code on the other platforms it installs on; Linux runs in `rust`.
  native-cli:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - run: cargo test --locked --package latkit --features native --lib --test validation
      - run: cargo test --locked --package latkit-cli

  # The npm package: built from the crate, checked, tested, every pipeline compiled in Chrome on
  # SwiftShader, and the packed tarball installed and drawn in a consumer.
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - name: Read the WASM bindings generator's version
        id: bindgen
        run: |
          echo "version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: bindgen-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.bindgen.outputs.version }}
      - name: Install the matching WASM bindings generator
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.bindgen.outputs.version }}" --locked
      - run: pnpm --dir npm/examples exec playwright-core install --with-deps chromium
      - run: cargo xtask wasm --dev
      - run: pnpm format:check
      - run: pnpm lint
      - run: node npm/docs.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo xtask browser
      - run: cargo xtask package
      - run: cargo xtask package-test

  # The docs as Read the Docs builds them: a warning fails.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r docs/requirements.txt
      - run: sphinx-build -W --keep-going -b html docs target/docs
