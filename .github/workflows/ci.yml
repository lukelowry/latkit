name: CI

# What a release depends on: the crates build, pass their tests, document, and package on every
# platform they ship to; the npm tarball works in a consumer; the docs build. The jobs that build
# Rust run their steps as `cargo xtask ci <job>`, and `cargo xtask check` runs every job's steps.
# Frame budgets and the benchmark need a GPU, which runners lack: run `cargo xtask check` and
# `cargo xtask bench` locally.
#
# CI checks pull requests. Branch protection requires `CI passed` on a branch up to date with main,
# so every commit on main is a tree that passed, and the release publishes it without checking it
# again. A push to main that changes dependencies runs everything once more, to save the caches
# pull requests restore.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # What a pull request touched; a push to main checks everything. The version pull request changes
  # only versions and the changelog, so it checks formatting alone: the release packages and tests
  # what it publishes. macOS, whose runners queue for minutes, runs when native code changes, which
  # holds all of its platform code.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.head_ref != 'changeset-release/main' && (github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true') }}
      native: ${{ github.head_ref != 'changeset-release/main' && (github.event_name != 'pull_request' || steps.filter.outputs.native == 'true') }}
      npm: ${{ github.head_ref != 'changeset-release/main' && (github.event_name != 'pull_request' || steps.filter.outputs.npm == 'true') }}
      docs: ${{ github.head_ref != 'changeset-release/main' && (github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true') }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust: &rust
              - 'crates/**'
              - 'xtask/**'
              - '.cargo/**'
              - '*.toml'
              - 'Cargo.lock'
              - 'docs/reference/**'
              - '.github/workflows/ci.yml'
            npm:
              - *rust
              - 'npm/**'
              - 'benchmark/**'
              - 'package.json'
              - 'pnpm-*.yaml'
              - '*.config.*'
              - 'tsconfig*.json'
            docs:
              - 'docs/**'
              - '.readthedocs.yaml'
              - 'npm/test/consumer/quickstart.ts'
              - '.github/workflows/ci.yml'
            native:
              - 'crates/latkit/src/host/**'
              - 'crates/latkit-cli/**'
              - 'crates/latkit/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'

  # Prettier over every file: cheap, and any pull request can unformat one.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Lavapipe, Vulkan on the CPU, runs the GPU tests instead of skipping; text tests need fonts.
      # Cached, since apt took up to 7 minutes.
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: mesa-vulkan-drivers fonts-dejavu-core
          version: 1
      - run: cargo xtask ci rust

  # The CLI's native code on the other platforms it installs on; Linux runs in `rust`. Windows runs
  # with `rust`, and macOS when native code changes.
  native-cli:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.native == 'true' && '["macos-latest", "windows-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask ci native-cli

  # The npm package: built once from the crate in release, checked, tested, every pipeline compiled
  # in Chrome on SwiftShader, and that build packed, installed, and drawn in a consumer.
  npm:
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - name: Read the WASM bindings generator's version
        id: bindgen
        run: |
          version=$(cargo xtask bindgen-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: bindgen-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.bindgen.outputs.version }}
      - name: Install the matching WASM bindings generator
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.bindgen.outputs.version }}" --locked
      # The runner's Chrome drives the browser gate.
      - run: cargo xtask ci npm
        env:
          LATKIT_CHROME: /usr/bin/google-chrome

  # The docs as Read the Docs builds them, from the locked environment: a warning fails.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked --project docs --group docs
      - run: uv run --locked --project docs sphinx-build -W --keep-going -b html docs target/docs

  # The one check branch protection requires: every job above passed, or was not needed.
  passed:
    name: CI passed
    if: always()
    needs: [changes, format, rust, native-cli, npm, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.changes.result != 'success'
        run: exit 1
