name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm build:examples
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm -r --filter "./packages/**" exec npm pack --dry-run

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Both runs share this machine, so timings compare fairly.
      - name: Benchmark the base branch
        run: |
          git worktree add .bench/base origin/${{ github.base_ref }}
          cd .bench/base
          pnpm install --frozen-lockfile
          pnpm bench --outputJson ../base.json || echo "The base branch has no benchmarks."
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench:gate

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r docs/requirements.txt
      - run: pnpm docs:build
