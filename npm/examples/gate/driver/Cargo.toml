[package]
name = "latkit-browser-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "tests.rs"
crate-type = ["cdylib"]

[dependencies]
latkit = { path = "../../../../crates/latkit", features = ["web"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[profile.release]
opt-level = 2
panic = "abort"
strip = true
