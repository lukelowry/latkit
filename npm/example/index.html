<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>latkit grid</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f141a;
        color: #c9d1d9;
        font: 13px system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: calc(100% - 40px);
      }
      nav {
        height: 40px;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 0 12px;
      }
      button {
        background: #1c2632;
        color: inherit;
        border: 1px solid #2d3a48;
        border-radius: 4px;
        padding: 4px 10px;
      }
    </style>
  </head>
  <body>
    <nav>
      <button data-space="plane">Plane</button>
      <button data-space="earth">Map</button>
      <button data-space="globe">Globe</button>
      <span id="status"></span>
    </nav>
    <canvas id="canvas"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
