[package]
name = "latkit-cli"
description = "Render latkit scenes of JSON or binary data to images and videos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "README.md"]

[[bin]]
name = "latkit"
path = "src/main.rs"

[dependencies]
latkit = { workspace = true, features = ["native"] }
clap.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde.workspace = true
tempfile.workspace = true

[lints]
workspace = true
