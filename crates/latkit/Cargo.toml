[package]
name = "latkit"
description = "Columnar data drawn as vertices, edges, lines, and areas on the GPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**", "build/**", "build.rs", "shaders/**", "colormaps/catalog.txt"]

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:glam", "dep:web-time", "dep:wesl", "dep:naga"]
serde = []
web = ["gpu", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys"]

[dependencies]
thiserror.workspace = true
hashbrown.workspace = true
rustc-hash.workspace = true
bytemuck.workspace = true
# GeoJSON, tiles' metadata, and gzip-compressed bytes.
serde = { workspace = true }
serde_json.workspace = true
flate2.workspace = true
wgpu = { workspace = true, optional = true }
glam = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "AddEventListenerOptions",
    "CssStyleDeclaration",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "Headers",
    "HtmlElement",
    "ImageData",
    "KeyboardEvent",
    "MouseEvent",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "PointerEvent",
    "Request",
    "RequestInit",
    "ResizeObserver",
    "Response",
    "TextMetrics",
    "WheelEvent",
    "Window",
] }

[build-dependencies]
wesl = { workspace = true, optional = true }
naga = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
pollster.workspace = true
wgpu.workspace = true
bytemuck.workspace = true

[lints]
workspace = true
