[workspace]
members = ["crates/*", "xtask"]
default-members = ["crates/latkit"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lukelowry/latkit"

[workspace.dependencies]
latkit = { path = "crates/latkit", default-features = false }

thiserror = "2"
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
rustc-hash = "2"

wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
web-time = "1"

wesl = "0.6"
naga = { version = "30", features = ["wgsl-in"] }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
flate2 = "1"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

proptest = "1"
pollster = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true

[profile.wasm-dev]
inherits = "wasm"
opt-level = 2
lto = false
codegen-units = 16
incremental = true

[profile.dev.package."*"]
opt-level = 2
