<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f6feb'/%3E%3C/svg%3E"
    />
    <title>@latkit/network example</title>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="application"
      aria-label="Network visualization. Arrow keys pan, plus and minus zoom, Shift with arrow keys rotates, Escape clears the selection."
    ></canvas>

    <div id="hud">
      <header>
        <h1>latkit / network</h1>
        <div id="status" aria-live="polite">loading</div>
      </header>

      <section>
        <span class="label" id="topologies-label">topology</span>
        <div id="topologies" class="row" role="group" aria-labelledby="topologies-label"></div>
      </section>

      <section>
        <span class="label" id="projections-label">projection</span>
        <div id="projections" class="row" role="group" aria-labelledby="projections-label"></div>
      </section>

      <section>
        <span class="label" id="camera-label">camera</span>
        <div id="camera" class="row" role="group" aria-labelledby="camera-label"></div>
      </section>

      <section>
        <span class="label" id="toggles-label">layers</span>
        <div id="toggles" class="row" role="group" aria-labelledby="toggles-label"></div>
      </section>

      <section>
        <span class="label" id="colormaps-label">colormap</span>
        <div id="colormaps" class="row" role="group" aria-labelledby="colormaps-label"></div>
      </section>

      <section id="readout">
        <span class="label">pick</span>
        <div class="pick"><span>hover</span><span class="hover">-</span></div>
        <div class="pick"><span>select</span><span class="select" aria-live="polite">-</span></div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
