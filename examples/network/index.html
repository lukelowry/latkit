<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f6feb'/%3E%3C/svg%3E"
    />
    <title>latkit · grid over the earth</title>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      role="application"
      aria-label="A power grid over the earth. Drag to pan, scroll to zoom, right-drag or Shift-drag to turn, click to select, Escape clears the selection."
    ></canvas>

    <aside id="panel" aria-label="Controls">
      <header>
        <h1>latkit <span>grid over the earth</span></h1>
        <p id="status" aria-live="polite">starting…</p>
      </header>
      <div id="sections"></div>
      <p class="hint">Drag to pan · scroll to zoom · right-drag to turn · click to inspect</p>
    </aside>

    <section id="inspector" aria-live="polite" hidden></section>
    <footer id="attribution"></footer>

    <script type="module" src="/src/earth/main.ts"></script>
  </body>
</html>
