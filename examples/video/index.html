<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Latkit video exports</title>
    <style>
      body {
        margin: 32px;
        background: #101723;
        color: #e3eaf2;
        font: 16px system-ui;
      }
      button,
      a {
        color: inherit;
      }
      button {
        padding: 10px 18px;
        background: #253952;
        border: 1px solid #4e6785;
        border-radius: 6px;
        cursor: pointer;
      }
      video {
        width: min(100%, 960px);
        display: block;
        margin: 12px 0;
      }
      canvas {
        width: 640px;
        height: 400px;
      }
      #source {
        position: absolute;
        left: -10000px;
      }
      pre {
        white-space: pre-wrap;
      }
      article {
        margin: 32px 0;
      }
    </style>
  </head>
  <body>
    <h1>Latkit video exports</h1>
    <p>
      Native network and monitor rendering, shared GPU composition, and bounded video encoding.
      Export runs in an application-owned worker and writes directly to a temporary file.
    </p>
    <button id="export">Export proof videos</button>
    <button id="cancel" disabled>Cancel export</button>
    <pre id="status">Ready</pre>
    <section id="results"></section>
    <div id="source"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
